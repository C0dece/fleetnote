[package]
name = "fleetnote"
version = "0.3.0"
description = "Fleetnote — Markdown-база знаний для ПК и смартфонов"
authors = ["Fleetnote"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fleetnote_lib"
# staticlib/cdylib нужны для сборки под iOS и Android из той же кодовой базы
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
# системное хранилище секретов: Keychain, Credential Manager, Secret Service
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
