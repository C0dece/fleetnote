name: Сборка приложения

# Установщики под Windows, macOS и Linux собираются на машинах GitHub,
# поэтому локально не нужны ни Rust, ни Visual Studio, ни Xcode.
#
# Запуск: вручную (Actions → Run workflow), по тегу v* или коммитом в main
# со словом [release] в сообщении. Релиз с установщиками создаёт сам GitHub.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

jobs:
  build:
    # На обычный коммит в main сборку не гоняем — только когда её явно просят
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release]')

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости (только Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Ключи Google берём из секрета: принимается и JSON из консоли, и отдельные значения.
      # Сами значения в лог не попадают.
      - name: Подставить ключи Google
        shell: bash
        env:
          DESKTOPCLIENT: ${{ secrets.DESKTOPCLIENT }}
          GDRIVE_CLIENT_JSON: ${{ secrets.GDRIVE_CLIENT_JSON }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: node scripts/ci-google-keys.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # VITE_GDRIVE_* приходят из шага «Подставить ключи Google» через GITHUB_ENV
        with:
          args: ${{ matrix.args }}
          # __VERSION__ подставляется из версии приложения в tauri.conf.json
          tagName: v__VERSION__
          releaseName: Fleetnote v__VERSION__
          releaseBody: |
            Установщики собраны автоматически из исходников этого репозитория.

            - Windows: `.exe` (NSIS) или `.msi`
            - macOS: `.dmg` (universal — Intel и Apple Silicon)
            - Linux: `.AppImage` или `.deb`

            Приложение не подписано сертификатом разработчика: Windows покажет
            SmartScreen («Подробнее» → «Выполнить в любом случае»), macOS —
            предупреждение Gatekeeper (правый клик по приложению → «Открыть»).
          releaseDraft: false
          prerelease: false
