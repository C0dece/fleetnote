name: Сборка приложения

# Установщики под Windows, macOS и Linux собираются на машинах GitHub,
# поэтому локально не нужны ни Rust, ни Visual Studio, ни Xcode.
#
# Запуск: вручную (Actions → Run workflow), по тегу v* или коммитом в main
# со словом [release] в сообщении.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

jobs:
  # Черновик релиза создаётся один раз: если его делать в каждой сборке,
  # джобы гоняются за один тег и часть падает с «Published releases must have a valid tag».
  prepare:
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Узнать версию приложения
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Создать или найти черновик релиза
        id: release
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = `v${{ steps.version.outputs.version }}`;
            const { owner, repo } = context.repo;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Релиз ${tag} уже существует, дополняю его`);
              return String(existing.data.id);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const created = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `Fleetnote ${tag}`,
              draft: true,
              prerelease: false,
              body: [
                "Установщики собраны автоматически из исходников этого репозитория.",
                "",
                "- Windows: `.exe` (NSIS) или `.msi`",
                "- macOS: `.dmg` (universal — Intel и Apple Silicon)",
                "- Linux: `.AppImage`, `.deb` или `.rpm`",
                "",
                "Приложение не подписано сертификатом разработчика: Windows покажет",
                "SmartScreen («Подробнее» → «Выполнить в любом случае»), macOS —",
                "предупреждение Gatekeeper (правый клик по приложению → «Открыть»).",
              ].join("\n"),
            });
            return String(created.data.id);

  build:
    needs: prepare
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости (только Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Ключи Google берём из секрета: принимается и JSON из консоли, и отдельные значения.
      # Сами значения в лог не попадают.
      - name: Подставить ключи Google
        shell: bash
        env:
          DESKTOPCLIENT: ${{ secrets.DESKTOPCLIENT }}
          GDRIVE_CLIENT_JSON: ${{ secrets.GDRIVE_CLIENT_JSON }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: node scripts/ci-google-keys.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # VITE_GDRIVE_* приходят из шага «Подставить ключи Google» через GITHUB_ENV
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}

  # Релиз становится видимым только когда все платформы собрались
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Опубликовать релиз
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: Number("${{ needs.prepare.outputs.release_id }}"),
              draft: false,
            });
            core.info("Релиз опубликован");
